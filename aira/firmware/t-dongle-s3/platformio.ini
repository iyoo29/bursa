; PlatformIO configuration for AIRA Firmware
; Target: LILYGO T-Dongle S3 Standard
; ESP32-S3 with USB, Wi-Fi, LCD 0.96" 160x80, RGB LED, Button

[platformio]
build_dir = C:\t

[env:t-dongle-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:fix_toolchain_path.py

; USB CDC + HID
; Konfigurasi TFT_eSPI dipindahkan ke src/User_Setup.h
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DLED_PIN=40
    -DBOOT_BTN_PIN=0
    -include src/User_Setup.h

; Upload & Monitor port
upload_port = COM5
monitor_port = COM5

; Monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Board specific
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

; Dependencies (FastLED dihapus - diganti driver APA102 native)
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.1
